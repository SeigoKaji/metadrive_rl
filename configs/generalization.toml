# Canonical bundle for multi-scenario training and unseen-scenario evaluation.
# `--profile generalization` resolves to this file.
schema_version = 2
name = "generalization"
algorithm = "ppo"
default_model_name = "generalization"

[training]
policy = "MlpPolicy"
seed = 0
num_envs = 4
n_steps = 4096
total_timesteps = 1000000
log_interval = 4
device = "cpu"
learning_rate = 0.0003
batch_size = 64
n_epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
normalize_advantage = true
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5

[evaluation]
record_gif = true
output_prefix = "generalization"
seed = 0
device = "cpu"
deterministic = true

[environment.common]
map = 3
discrete_action = true
discrete_throttle_dim = 3
discrete_steering_dim = 3
horizon = 1000
random_spawn_lane_index = true
random_lane_width = true
random_lane_num = true
random_agent_model = true
traffic_density = 0.1
random_traffic = false
accident_prob = 0.0
store_map = false
log_level = 50

[environment.train]
start_seed = 1000
num_scenarios = 1000

[environment.evaluation]
start_seed = 0
num_scenarios = 200
