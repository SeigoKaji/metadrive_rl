# Canonical experiment bundle for the MetaDrive official SB3 PPO example.
# `--profile official` and no selection argument both resolve to this file.
schema_version = 2
name = "official"
algorithm = "ppo"
default_model_name = "official_baseline"

[training]
policy = "MlpPolicy"
seed = 0
num_envs = 4
n_steps = 4096
total_timesteps = 300000
log_interval = 4
device = "cpu"
learning_rate = 0.0003
batch_size = 64
n_epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
normalize_advantage = true
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5

[evaluation]
record_gif = true
output_prefix = "official_baseline"
seed = 0
device = "cpu"
deterministic = true

[environment.common]
map = "C"
discrete_action = true
discrete_throttle_dim = 3
discrete_steering_dim = 3
horizon = 500
random_spawn_lane_index = false
traffic_density = 0
accident_prob = 0
log_level = 50

# Training retains the official sample's single scenario at seed 5.
[environment.train]
start_seed = 5
num_scenarios = 1

# Evaluation uses the same official sample scenario at seed 5.
[environment.evaluation]
start_seed = 5
num_scenarios = 1
