# Official MetaDrive 259-wide fixed-stress preset.
# Run from the repository root after the official model has been trained.
backend = "metadrive"
model_path = "models/official_baseline.zip"
environment_config = "configs/official.toml"
schema = "input_schema_259.toml"
output_dir = "outputs/official/input_attribution/official_fixed_stress"
base_main_sha = "7849aad80ac353fd616c1a1398c11dd3497eed05"
scenario_seed = 5
policy_seed = 5
horizon = 500
record_gif = true
deterministic = true
fixed_value = -1.0

