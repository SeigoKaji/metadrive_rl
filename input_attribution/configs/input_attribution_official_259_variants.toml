# Source-verified 259-dimensional typed-variant example.  Local operations
# cover the full episode; the old reference-bank experiment is preserved in
# input_attribution_official_259_legacy_freeze.toml.

[analysis]
name = "input_attribution_official_259_variants"
experiment = "official_baseline_259_typed_variants"
description = "Full-episode typed diagnostics for verified indices 2 and 8"
deterministic = true
individual_inputs = true

[model]
path = "../../models/official_baseline.zip"
name = "official_baseline"
format = "stable_baselines3_ppo_zip"
device = "cpu"
deterministic = true

[adapter]
module = "input_attribution.adapters.metadrive"
factory = "input_attribution.adapters.metadrive.create_adapter"

[schema]
path = "../schemas/official_259.json"
name = "metadrive_default_259"
dimension = 259
template = false

[environment]
path = "../../configs/official.toml"

[scenario]
map = "C"
seed = 5
scenario_seed = 5
rl_seed = 0
horizon = 500
traffic_density = 0
episodes = 1

[seeds]
scenario_seed = 5
rl_seed = 0
intervention = 0

[preprocess]
name = "sb3_vector_box_identity"
external_normalization = false

[output]
root = "../../outputs/input_attribution"
experiment = "official_baseline_259_typed_variants"
model = "official_baseline"

[closed_loop]
enabled = true
# Keep B focused.  A may expand the LiDAR group offline as a separate detail.
patterns = ["P00", "P01_road_boundaries_reference", "P02_heading_neutral", "P02_heading_reflection", "P02_heading_low", "P02_heading_high", "P03_speed_reference", "P03_steering_reference", "P03_history_group_reference", "P04_lateral_neutral", "P04_lateral_reflection", "P04_lateral_low", "P04_lateral_high", "P06_lidar_no_detection", "P06_lidar_virtual_detection"]
episodes = 1
max_steps = 500

[video]
enabled = false
# Enable only after selecting the declared pattern IDs, for example:
# patterns = ["P00", "P04_lateral_low"]

[ig]
enabled = false

[[patterns]]
id = "P00"
description = "unchanged reference observation"
indices = []
method = "identity"
scope = "full_episode"
on_inapplicable = "abort_pattern"

[[patterns]]
id = "P02_heading_neutral"
description = "index 2 verified neutral normalized component"
indices = [2]
method = "neutral"
variant_id = "heading_neutral_0_5"
scope = "full_episode"
on_inapplicable = "abort_pattern"
# 1e-7 is only a float32 numerical-difference reporting tolerance for this
# analysis; it is not a universal scientific significance threshold.
tolerance = 1e-7

[[patterns]]
id = "P01_road_boundaries_reference"
description = "legacy compatibility supplement: road-boundary pair from one frozen reference"
indices = [0, 1]
method = "reference"
reference_id = "episode-0:0"
replacement_kind = "saved_observation_reference"
scope = "explicitly_conditional"
on_inapplicable = "continue_unmodified_with_warning"
metadata = { compatibility_keys = ["road_segment_id", "target_lane_ordinal"] }

[[patterns]]
id = "P03_speed_reference"
description = "speed input reference supplement; no zero-speed assumption"
indices = [3]
method = "reference"
reference_id = "episode-0:0"
replacement_kind = "saved_observation_reference"
scope = "explicitly_conditional"
on_inapplicable = "continue_unmodified_with_warning"
metadata = { compatibility_keys = ["road_segment_id", "target_lane_ordinal"] }

[[patterns]]
id = "P03_speed_fixed_level"
description = "speed input explicit normalized diagnostic level; not called zero physical speed"
indices = [3]
method = "fixed_level"
variant_id = "speed_fixed_level_0_2"
scope = "full_episode"
on_inapplicable = "abort_pattern"

[[patterns]]
