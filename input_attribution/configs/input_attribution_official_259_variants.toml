on_inapplicable = "abort_pattern"
variant = { id = "history_group_neutral_0_5", operation = "neutral", values = { current_steering = 0.5, previous_steering_action = 0.5, previous_throttle_brake_action = 0.5 }, allowed_ids = ["current_steering", "previous_steering_action", "previous_throttle_brake_action"], meaning = "normalized neutral action/history group", evidence = "state_obs.py and env_input_policy.py action-history encoding", confirmed = true }

