<svg xmlns="http://www.w3.org/2000/svg" width="840" height="644" viewBox="0 0 840 644" role="img" aria-labelledby="title desc">
  <title id="title">world 座標から車体座標への変換</title>
  <desc id="desc">左図の車体は world の x 軸から反時計回りに角度 psi だけ向いている。車体基準点 p を原点に、前方単位ベクトル f と左方単位ベクトル l をとり、差ベクトル Delta = q - p を各軸に投影して x_g と y_g を得る。右図は同じ注視点を前方が右、左方が上の車体座標で表す。いずれも原点は車体中央であり、後輪車軸中心ではない。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <style>
      text { font-family: sans-serif; font-size: 20px; fill: #172b4d; }
      .heading { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 17px; }
      .blue { fill: #2563eb; }
      .green { fill: #0f766e; }
      .amber { fill: #b45309; }
      .muted { fill: #64748b; }
      .invalid { fill: #b91c1c; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .guide { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .axis { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .dimension { fill: none; stroke: #64748b; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .route-blue { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; }
      .route-green { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linecap: round; }
      .point { fill: #172b4d; }
    </style>
  </defs>
  <rect width="840" height="644" fill="white"/>
  <text x="28" y="34" class="heading">1.5 座標変換：注視点を車体の前方・左方の成分で表す</text>
  <text x="28" y="63" class="small">左右の図は同じ p と q。例では x_g &gt; 0、y_g &gt; 0。</text>
  <rect x="24" y="86" width="450" height="420" rx="10" class="panel"/>
  <rect x="490" y="86" width="326" height="420" rx="10" class="panel"/>
  <text x="44" y="118" class="label">world 座標</text>
  <text x="510" y="118" class="label">車体座標（p が原点）</text>

  <path d="M 65 462 L 437 462 M 65 462 L 65 147" class="axis"/>
  <text x="347" y="488" class="small muted">world の +x</text>
  <text x="80" y="151" class="small muted">world の +y</text>
  <g transform="translate(180 385) rotate(-30)">
    <rect x="-34" y="-17" width="68" height="34" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 17 -9 L 26 0 L 17 9" fill="none" stroke="#b45309" stroke-width="1.5"/>
  </g>
  <path d="M 180 385 L 410 252.21" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <path d="M 180 385 L 85 220.46" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="335" y="237" class="small blue">+x / 前方 f</text>
  <text x="84" y="198" class="small green">+y / 左方 l</text>
  <path d="M 180 385 L 277 385" class="guide"/>
  <path d="M 240 385 A 60 60 0 0 0 231.96 355" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="254" y="375">ψ</text>
  <path d="M 335.88 295 L 280.88 199.74 L 125 289.74" class="guide"/>
  <path d="M 180 385 L 335.88 295" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M 180 385 L 125 289.74" fill="none" stroke="#0f766e" stroke-width="4"/>
  <text x="270" y="350" class="blue">x_g</text>
  <text x="96" y="337" class="green">y_g</text>
  <path d="M 180 385 L 280.88 199.74" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#amber-arrow)"/>
  <text x="246" y="281" class="amber">Δ</text>
  <circle cx="180" cy="385" r="5" fill="#b45309"/>
  <circle cx="280.88" cy="199.74" r="5" fill="#0f766e"/>
  <text x="158" y="422" class="amber">p</text>
  <text x="293" y="193" class="green">q</text>

  <path d="M 550 392 L 791 392" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <path d="M 550 392 L 550 154" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="713" y="453" class="small blue">+x / 前方</text>
  <text x="564" y="168" class="small green">+y / 左方</text>
  <path d="M 730 392 L 730 282 L 550 282" class="guide"/>
  <path d="M 550 392 L 730 392" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M 550 392 L 550 282" fill="none" stroke="#0f766e" stroke-width="4"/>
  <text x="730" y="422" text-anchor="middle" class="blue">x_g</text>
  <text x="501" y="287" class="green">y_g</text>
  <path d="M 550 392 L 730 282" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#amber-arrow)"/>
  <text x="632" y="321" class="amber">Δ</text>
  <circle cx="550" cy="392" r="5" fill="#b45309"/>
  <circle cx="730" cy="282" r="5" fill="#0f766e"/>
  <text x="510" y="452" class="small amber">p = (0, 0)</text>
  <text x="660" y="254" class="green">q = (x_g, y_g)</text>
  <text x="510" y="487" class="small muted">前方が右、車体左方が上。</text>

  <rect x="24" y="522" width="792" height="102" rx="10" class="panel"/>
  <text x="44" y="554" class="label">Δ = q − p　　x_g = Δ · f　　y_g = Δ · l</text>
  <text x="44" y="584" class="small">ψ：world の +x 軸から車体前方への反時計回りの角度</text>
  <text x="44" y="611" class="small">単位は m。観測に入れる前に 1.6 節の clip・正規化を行う。</text>
</svg>
