<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc">
  <title id="title">二輪モデルの旋回幾何と前輪操舵角</title>
  <desc id="desc">左旋回 R&gt;0 の例。後輪中心 O が原点、右が車体前方 x、上が車体左方 y。前輪 F と後輪 O が同じ旋回中心 C のまわりを動く。前輪の向きは半径 CF に垂直で、車体前方との角度が delta である。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <style>
      text { font-family: sans-serif; font-size: 17px; fill: #172b4d; }
      .heading { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; }
      .axis { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .radius { stroke: #2563eb; stroke-width: 2; fill: none; }
      .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
      .point { fill: #172b4d; }
    </style>
  </defs>
  <rect width="480" height="460" fill="white"/>
  <g transform="translate(-480 0)">
    <text x="518" y="32" class="heading">同じ旋回中心 C を使う二輪モデル</text>
    <text x="518" y="57" class="small">右：車体前方 x ／ 上：車体左方 y</text>

    <path d="M 580 372 L 580 70" class="axis"/>
    <path d="M 548 340 L 910 340" class="axis"/>
    <text x="554" y="80">y</text>
    <text x="900" y="365">x</text>
    <path d="M 580 340 L 580 90 L 730 340" class="radius"/>
    <path d="M 580 328 L 592 328 L 592 340" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="580" y1="340" x2="730" y2="340" stroke="#475569" stroke-width="4"/>
    <line x1="560" y1="340" x2="600" y2="340" stroke="#172b4d" stroke-width="8" stroke-linecap="round"/>
    <line x1="708.56" y1="352.86" x2="751.44" y2="327.14" stroke="#172b4d" stroke-width="8" stroke-linecap="round"/>
    <path d="M 750.58 327.65 L 828.61 280.83" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#orange-arrow)"/>
    <path d="M 773 340 A 43 43 0 0 0 766.87 317.88" stroke="#b45309" stroke-width="2" fill="none"/>
    <path d="M 723.83 329.71 L 734.12 323.54 L 740.29 333.83" stroke="#b45309" stroke-width="1.5" fill="none"/>
    <circle cx="580" cy="90" r="4.5" class="point"/>
    <text x="597" y="85">C = (0, R)</text>
    <text x="548" y="369">O（後輪）</text>
    <text x="704" y="369">F（前輪）</text>
    <text x="634" y="313">車体</text>
    <text x="554" y="212">R</text>
    <text x="787" y="327" style="fill:#b45309;font-size:21px">δ</text>
    <text x="793" y="261" class="small">前輪の向き</text>
    <path d="M 580 391 L 730 391" stroke="#475569" stroke-width="1.3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="646" y="413">L<tspan baseline-shift="sub" font-size="12">w</tspan></text>
    <text x="754" y="411" class="small">前輪方向と CF は直角</text>
    <text x="518" y="442" class="small">前輪と後輪の旋回中心は同じ。円の半径は異なる。</text>
  </g>
</svg>
