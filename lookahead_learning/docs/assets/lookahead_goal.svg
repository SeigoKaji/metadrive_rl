<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620" role="img" aria-labelledby="title desc">
  <title id="title">経路に沿った注視距離と終端の判定</title>
  <desc id="desc">投影点から円弧に沿って L_d だけ進み、累積距離 S_goal = S_proj + L_d にある点 q = P(S_goal) を注視点とする。L_d は投影点と注視点を結ぶ弦の長さとは異なる。下段の累積距離軸では S_goal が S_end を越えると無効になり、経路終点への丸めや外挿を行わないことを示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <style>
      text { font-family: sans-serif; font-size: 20px; fill: #172b4d; }
      .heading { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 17px; }
      .blue { fill: #2563eb; }
      .green { fill: #0f766e; }
      .amber { fill: #b45309; }
      .muted { fill: #64748b; }
      .invalid { fill: #b91c1c; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .guide { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .axis { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .dimension { fill: none; stroke: #64748b; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .route-blue { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; }
      .route-green { fill: none; stroke: #0f766e; stroke-width: 5; stroke-linecap: round; }
      .point { fill: #172b4d; }
    </style>
  </defs>
  <rect width="840" height="620" fill="white"/>
  <text x="28" y="34" class="heading">1.4 注視点：投影点から経路に沿って L_d だけ進む</text>
  <text x="28" y="63" class="small">緑の円弧が L_d。灰色の破線は、投影点と注視点を結ぶ弦。</text>

  <path d="M 70 350 L 150 350" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 150 350 A 180 180 0 0 0 330 170" class="route-green"/>
  <path d="M 305.88 260 A 180 180 0 0 0 327.27 201.26" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#green-arrow)"/>
  <path d="M 330 170 L 330 108" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 150 350 L 330 170" class="guide"/>
  <text x="102" y="247" class="small muted">弦（直線距離）</text>
  <path d="M 208 255 L 237 263" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 286 288 L 370 288" fill="none" stroke="#0f766e" stroke-width="1"/>
  <text x="384" y="287" class="label green">L_d</text>
  <text x="384" y="314" class="small green">経路に沿う弧長</text>

  <circle cx="150" cy="350" r="5" fill="#2563eb"/>
  <text x="44" y="327" class="small blue">投影点</text>
  <text x="200" y="378" class="blue">P(S_proj)</text>
  <path d="M 156 355 L 190 371" fill="none" stroke="#2563eb" stroke-width="1"/>
  <rect x="115" y="376" width="70" height="32" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <path d="M 164 383 L 173 392 L 164 401" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <path d="M 150 350 L 150 392" class="guide"/>
  <circle cx="150" cy="392" r="4.5" fill="#b45309"/>
  <text x="64" y="430" class="small amber">車体基準点 p</text>
  <circle cx="330" cy="170" r="6" fill="#0f766e"/>
  <text x="353" y="174" class="green">q</text>
  <text x="353" y="201" class="small green">注視点</text>

  <rect x="448" y="96" width="368" height="148" rx="10" class="panel"/>
  <text x="470" y="129" class="label">S_goal = S_proj + L_d</text>
  <text x="470" y="163" class="label">q = P(S_goal)</text>
  <text x="470" y="198" class="small">まず累積距離を足し、</text>
  <text x="470" y="224" class="small">次に経路上の座標を得る。</text>

  <rect x="24" y="452" width="792" height="148" rx="10" class="panel"/>
  <text x="44" y="480" class="label">終端を越える場合</text>
  <text x="676" y="480" class="small muted">累積距離 S</text>
  <path d="M 70 533 L 515 533" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M 515 533 L 755 533" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M 160 508 L 680 508" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="403" y="501" class="small green">L_d</text>
  <circle cx="160" cy="533" r="5" fill="#2563eb"/>
  <path d="M 515 522 L 515 544" fill="none" stroke="#172b4d" stroke-width="2"/>
  <path d="M 673 526 L 687 540 M 673 540 L 687 526" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <text x="160" y="563" text-anchor="middle" class="small blue">S_proj</text>
  <text x="515" y="563" text-anchor="middle" class="small">S_end</text>
  <text x="680" y="563" text-anchor="middle" class="small invalid">S_goal</text>
  <text x="44" y="588" class="small invalid">S_goal &gt; S_end → 無効（b = 0）。終点への丸め・外挿はしない。</text>
</svg>
