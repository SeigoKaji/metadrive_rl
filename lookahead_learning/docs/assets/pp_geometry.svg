<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc">
  <title id="title">注視点を通る円の幾何</title>
  <desc id="desc">左旋回 R&gt;0 の例。後輪中心 O が原点、右が車体前方 x、上が車体左方 y。O で x 軸に接し注視点 Q を通る円の中心 C は y 軸上にある。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <style>
      text { font-family: sans-serif; font-size: 17px; fill: #172b4d; }
      .heading { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; }
      .axis { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .radius { stroke: #2563eb; stroke-width: 2; fill: none; }
      .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
      .point { fill: #172b4d; }
    </style>
  </defs>
  <rect width="480" height="460" fill="white"/>
  <text x="28" y="32" class="heading">注視点 Q を通る円</text>
  <text x="28" y="57" class="small">左旋回（R &gt; 0）の例</text>

  <path d="M 100 373 L 100 68" class="axis"/>
  <path d="M 67 340 L 445 340" class="axis"/>
  <text x="73" y="78">y</text>
  <text x="432" y="365">x</text>
  <path d="M 100 90 L 100 340 M 100 90 L 300 240" class="radius"/>
  <path d="M 100 340 A 250 250 0 0 0 300 240" fill="none" stroke="#0f766e" stroke-width="4"/>
  <path d="M 100 240 L 300 240 L 300 340" class="guide"/>
  <circle cx="100" cy="90" r="4.5" class="point"/>
  <circle cx="100" cy="340" r="4.5" class="point"/>
  <circle cx="300" cy="240" r="5" fill="#0f766e"/>
  <text x="119" y="84">C = (0, R)</text>
  <text x="42" y="367">O = (0, 0)</text>
  <text x="311" y="236">Q = (x, y)</text>
  <text x="74" y="211">R</text>
  <text x="213" y="154">|R|</text>
  <text x="193" y="230">x</text>
  <text x="315" y="295">y</text>
  <text x="206" y="371" class="small">後輪中心が描く円弧</text>
  <text x="28" y="420" class="small">O での接線が車体前方を向き、Q を通る。</text>
</svg>
